# .github/workflows/ci.yml
# Pipeline CI/CD — Compilar, probar, publicar imagen en Docker Hub
# Se activa en cada push o pull_request a la rama main

name: CI/CD — Build, Test & Docker Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Compilar y ejecutar pruebas con cobertura JaCoCo ────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Configura JDK 21 con caché Maven para acelerar builds sucesivos
      - name: Configurar JDK 21 con caché Maven
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Compila el proyecto, ejecuta pruebas y genera reporte JaCoCo
      - name: Compilar y ejecutar pruebas con cobertura
        run: mvn clean verify

      # Publica el reporte JaCoCo como artefacto descargable (7 días)
      - name: Publicar reporte JaCoCo como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # ── Job 2: Construir y publicar imagen en Docker Hub ───────────────
  # Solo se ejecuta en push a main (no en pull_request) y si Job 1 pasó
  docker-publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Autenticación en Docker Hub usando Secrets del repositorio
      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Genera tags semánticos: latest + sha-<commit> para trazabilidad
      - name: Extraer metadata para tags de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mi-spring-app
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Construye la imagen con el Dockerfile multi-stage y la publica
      - name: Construir y publicar imagen en Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
